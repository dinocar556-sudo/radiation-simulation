<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 태블릿 최적화: 화면 확대/축소 방지 (더블 탭 확대 방지) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>물체의 복사 평형 실험 시뮬레이션</title>

  <!-- 1. Tailwind CSS (디자인) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. React & ReactDOM (핵심 라이브러리) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- 3. PropTypes 및 React-is (그래프 라이브러리의 필수 의존성) -->
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>

  <!-- 4. Recharts (그래프 그리기 - 안정성을 위해 버전 고정) -->
  <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>

  <!-- 5. Babel (브라우저에서 실시간으로 React 코드를 번역해주는 도구) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 태블릿 UI 최적화용 커스텀 CSS -->
  <style>
    /* 전체 화면 텍스트 선택 방지 (버튼 연타 시 파랗게 선택되는 현상 방지) */
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* 모바일/태블릿에서 탭 할 때 회색 음영 생기는 것 제거 */
      -webkit-tap-highlight-color: transparent; 
    }
    
    /* 탐구 포인트 등 텍스트 선택이 필요한 곳만 허용 */
    .allow-select {
      -webkit-user-select: text;
      user-select: text;
    }

    /* 슬라이더 손잡이(Thumb) 크기 대폭 확대 - 아이들이 손가락으로 잡기 쉽게 */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    input[type=range]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    
    /* 슬라이더 드래그 시 화면이 스크롤되지 않도록 고정 */
    .touch-slider {
      touch-action: none; 
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 overscroll-none">

  <!-- React 앱이 렌더링될 빈 공간 -->
  <div id="root"></div>

  <!-- 여기서부터 실제 시뮬레이션 코드 -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceArea } = window.Recharts;

    // --- 아이콘 컴포넌트 정의 ---
    const Lightbulb = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    );
    const Thermometer = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
    );
    const Play = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );
    const Square = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
    );
    const RotateCcw = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const Ruler = ({ size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
    );

    // --- 메인 앱 로직 ---
    const App = () => {
      const ROOM_TEMP = 20; 
      const MAX_TIME = 24; 

      const [isLampOn, setIsLampOn] = useState(false);
      const [distance, setDistance] = useState(30); 
      const [temperature, setTemperature] = useState(ROOM_TEMP);
      const [time, setTime] = useState(0);
      const [data, setData] = useState([{ time: 0, temperature: ROOM_TEMP }]);
      const [isRunning, setIsRunning] = useState(false);

      const timerRef = useRef(null);

      const calculateNextTemp = (currentTemp, dist, lampOn, dt = 1) => {
        const heatAbsorbed = lampOn ? (3500 / (dist * dist)) : 0; 
        const heatRadiated = 0.2 * (currentTemp - ROOM_TEMP); 
        const deltaT = (heatAbsorbed - heatRadiated) * dt;
        return currentTemp + deltaT;
      };

      useEffect(() => {
        if (isRunning) {
          timerRef.current = setInterval(() => {
            setTime((prevTime) => {
              if (prevTime >= MAX_TIME) {
                setIsRunning(false);
                return prevTime;
              }
              
              const nextTime = parseFloat((prevTime + 0.1).toFixed(1));
              setTemperature((prevTemp) => {
                const nextTemp = calculateNextTemp(prevTemp, distance, isLampOn, 0.1);
                
                setData((prevData) => {
                  if (prevData.find(d => d.time === nextTime)) return prevData;
                  return [...prevData, { time: nextTime, temperature: parseFloat(nextTemp.toFixed(1)) }];
                });
                
                return nextTemp;
              });
              return nextTime;
            });
          }, 375); // 1분 30초 설정
        } else {
          clearInterval(timerRef.current);
        }

        return () => clearInterval(timerRef.current);
      }, [isRunning, distance, isLampOn]);

      const handleStartStop = () => {
        if (!isRunning && !isLampOn && time === 0) {
          setIsLampOn(true);
        }
        setIsRunning(!isRunning);
      };

      const handleReset = () => {
        setIsRunning(false);
        setIsLampOn(false);
        setTemperature(ROOM_TEMP);
        setTime(0);
        setData([{ time: 0, temperature: ROOM_TEMP }]);
      };

      const handleDistanceChange = (e) => {
        if (time > 0 && isRunning) {
          alert("실험 중에는 거리를 변경할 수 없습니다.\n초기화 후 다시 설정해주세요.");
          return;
        }
        setDistance(parseInt(e.target.value));
      };

      return (
        <div className="min-h-screen p-3 md:p-6 lg:p-8">
          <div className="max-w-6xl mx-auto space-y-4 md:space-y-6">
            
            <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 className="text-xl md:text-2xl font-bold text-slate-900 flex items-center gap-2">
                  <Lightbulb className="text-amber-500" />
                  물체의 복사 평형 실험
                </h1>
                <p className="text-sm md:text-base text-slate-500 mt-1">적외선등의 열을 흡수하고 방출하며 온도가 일정해지는 과정을 관찰해보세요.</p>
              </div>
              <div className="bg-blue-50 text-blue-700 px-4 py-2 md:px-6 md:py-3 rounded-lg font-bold text-base md:text-lg border border-blue-100 shadow-inner shrink-0 text-center flex items-center justify-center">
                진행 시간: {time.toFixed(1)} 분
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">
              
              <div className="lg:col-span-5 flex flex-col gap-4 md:gap-6">
                
                {/* 시각화 영역: 모바일/태블릿 화면을 고려해 높이를 유동적으로 조절 */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative h-[300px] md:h-[350px] flex flex-col justify-end overflow-hidden">
                  
                  <div className="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-2 text-slate-600 font-bold bg-slate-100 px-3 py-1 rounded-full text-xs md:text-sm z-30">
                    <Ruler size={16} />
                    <span>거리: {distance} cm</span>
                  </div>
                  
                  <div 
                    className="absolute top-12 left-1/2 -translate-x-1/2 h-[2px] bg-slate-300 transition-all duration-300"
                    style={{ width: `${distance * 3.5}px` }}
                  >
                    <div className="absolute -left-1 -top-[3px] w-2 h-2 bg-slate-400 rounded-full"></div>
                    <div className="absolute -right-1 -top-[3px] w-2 h-2 bg-slate-400 rounded-full"></div>
                  </div>

                  <div className="flex justify-center items-end w-full pb-2 relative h-full">
                    
                    <div 
                      className="flex flex-col items-center relative transition-all duration-300 z-20"
                      style={{ transform: `translateX(-${distance * 1.75}px)` }}
                    >
                      <div className="bg-white border-2 border-slate-700 rounded-t-md px-1 py-1 mb-1 shadow-sm w-12 md:w-16 text-center">
                        <span className="font-mono font-bold text-slate-800 text-xs md:text-sm">{temperature.toFixed(1)}</span>
                      </div>
                      <div className="w-1 h-6 md:h-8 bg-slate-400"></div>
                      <div className="w-12 md:w-16 h-2 bg-slate-300 rounded-t-sm border-b border-slate-400"></div>
                      <div className="w-10 md:w-14 h-16 md:h-20 bg-slate-800 rounded-b-md shadow-lg relative overflow-hidden border-b-2 border-slate-900">
                        <div 
                          className="absolute bottom-0 w-full bg-red-500/30 transition-all duration-1000"
                          style={{ height: `${Math.min(100, ((temperature - ROOM_TEMP) / 50) * 100)}%` }}
                        ></div>
                      </div>
                      <div className="w-12 md:w-16 h-6 md:h-8 bg-[#eab308] border border-[#ca8a04] mt-0 shadow-sm rounded-sm opacity-80"></div>
                    </div>

                    {isLampOn && (
                       <div className="absolute top-[60%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-full flex justify-center items-center pointer-events-none opacity-60 z-10">
                         <div className="w-[100px] h-[30px] bg-gradient-to-l from-red-500/0 via-red-500/50 to-red-500/0 rounded-full blur-md animate-pulse"></div>
                       </div>
                    )}

                    <div 
                      className="flex flex-col items-center relative transition-all duration-300 z-20"
                      style={{ transform: `translateX(${distance * 1.75}px)` }}
                    >
                      <div className={`w-12 h-12 md:w-16 md:h-16 rounded-full border-4 border-slate-300 flex items-center justify-center relative shadow-lg ${isLampOn ? 'bg-red-50' : 'bg-slate-100'}`}>
                        <div className={`w-6 h-6 md:w-10 md:h-10 rounded-full ${isLampOn ? 'bg-red-500 shadow-[0_0_20px_rgba(239,68,68,0.8)]' : 'bg-slate-300'}`}></div>
                        {isLampOn && (
                          <div 
                            className="absolute right-[85%] top-1/2 -translate-y-1/2 w-[120px] md:w-[180px] h-[80px] md:h-[120px] bg-gradient-to-l from-red-500/30 to-transparent"
                            style={{ clipPath: 'polygon(0 15%, 100% 45%, 100% 55%, 0 85%)' }}
                          ></div>
                        )}
                      </div>
                      <div className="w-2 h-16 md:w-3 md:h-20 bg-slate-400 mt-[-5px]"></div>
                      <div className="w-16 h-4 md:w-20 md:h-6 bg-blue-500 rounded-t-lg border-b-4 border-blue-600 relative">
                         <div className={`absolute top-1 right-2 md:top-2 md:right-4 w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${isLampOn ? 'bg-yellow-300' : 'bg-slate-800'}`}></div>
                      </div>
                    </div>
                  </div>
                  
                  <div className="absolute bottom-0 left-0 w-full h-3 md:h-4 bg-slate-200 border-t border-slate-300"></div>
                </div>

                {/* 컨트롤 패널 */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 space-y-5 md:space-y-6">
                  <div className="py-2">
                    <label className="flex justify-between text-sm md:text-base font-bold text-slate-700 mb-4 md:mb-3">
                      <span>적외선등과의 거리 설정</span>
                      <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">{distance} cm</span>
                    </label>
                    <input 
                      type="range" 
                      min="15" 
                      max="50" 
                      step="5"
                      value={distance} 
                      onChange={handleDistanceChange}
                      disabled={time > 0 && isRunning}
                      className="touch-slider w-full h-2 md:h-3 bg-slate-200 rounded-lg appearance-none accent-blue-600 disabled:opacity-50 disabled:bg-slate-300 outline-none"
                    />
                    <div className="flex justify-between text-xs md:text-sm text-slate-400 mt-3 font-medium">
                      <span>가까움 (15cm)</span>
                      <span>멂 (50cm)</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 md:gap-4">
                    {/* 버튼: 탭 피드백(active:scale) 추가로 눌렀을 때 반응성 극대화 */}
                    <button 
                      onClick={() => setIsLampOn(!isLampOn)}
                      className={`active:scale-[0.97] flex items-center justify-center gap-2 py-3 md:py-4 px-2 md:px-4 rounded-xl font-bold transition-all border-2 text-sm md:text-base ${
                        isLampOn 
                        ? 'bg-red-50 text-red-600 border-red-200 shadow-sm' 
                        : 'bg-slate-50 text-slate-600 border-slate-200'
                      }`}
                    >
                      <Lightbulb size={20} className={isLampOn ? "fill-red-500" : ""} />
                      <span className="hidden sm:inline">{isLampOn ? '적외선등 끄기' : '적외선등 켜기'}</span>
                      <span className="sm:hidden">{isLampOn ? '조명 끄기' : '조명 켜기'}</span>
                    </button>
                    
                    <button 
                      onClick={handleStartStop}
                      className={`active:scale-[0.97] flex items-center justify-center gap-2 py-3 md:py-4 px-2 md:px-4 rounded-xl font-bold text-white transition-all shadow-md text-sm md:text-base ${
                        isRunning 
                        ? 'bg-amber-500' 
                        : 'bg-blue-600'
                      }`}
                    >
                      {isRunning ? <Square size={20} className="fill-white" /> : <Play size={20} className="fill-white" />}
                      {isRunning ? '일시정지' : (time === 0 ? '실험 시작' : '계속 진행')}
                    </button>
                  </div>

                  <button 
                    onClick={handleReset}
                    className="active:scale-[0.98] w-full flex items-center justify-center gap-2 py-3 md:py-4 rounded-xl font-semibold text-slate-600 bg-slate-100 border border-slate-200 transition-colors text-sm md:text-base"
                  >
                    <RotateCcw size={18} />
                    처음부터 다시 (초기화)
                  </button>
                </div>

              </div>

              {/* 그래프 영역: 태블릿 세로 모드 대응을 위해 min-height 조정 */}
              <div className="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col min-h-[400px] md:min-h-[480px]">
                <div className="flex justify-between items-start mb-4 md:mb-6">
                  <div>
                    <h2 className="text-base md:text-lg font-bold text-slate-800 flex items-center gap-2 mb-1">
                      <Thermometer size={20} className="text-red-500" />
                      시간에 따른 온도 변화
                    </h2>
                  </div>
                  <div className="text-right shrink-0 bg-red-50 px-3 py-1.5 md:px-4 md:py-2 rounded-xl border border-red-100 shadow-sm">
                    <div className="text-[10px] md:text-xs text-red-800 font-semibold mb-0.5">현재 온도</div>
                    <div className="text-2xl md:text-3xl font-mono font-bold text-red-600 leading-none">
                      {temperature.toFixed(1)}<span className="text-sm md:text-lg text-slate-600 ml-1 font-sans">°C</span>
                    </div>
                  </div>
                </div>

                <div className="flex-1 w-full min-h-[250px] md:min-h-[300px]">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart
                      data={data}
                      margin={{ top: 10, right: 10, left: -20, bottom: 10 }}
                    >
                      <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" vertical={false} />
                      <XAxis 
                        dataKey="time" 
                        type="number" 
                        domain={[0, MAX_TIME]} 
                        tickCount={13}
                        stroke="#64748b"
                        tick={{fontSize: 12}}
                        label={{ value: '시간 (분)', position: 'insideBottom', offset: -10, fill: '#64748b', fontSize: 12, fontWeight: 500 }}
                      />
                      <YAxis 
                        domain={[ROOM_TEMP, 100]}
                        stroke="#64748b"
                        tick={{fontSize: 12}}
                        label={{ value: '온도 (°C)', angle: -90, position: 'insideLeft', offset: 25, fill: '#64748b', fontSize: 12, fontWeight: 500 }}
                      />
                      <Tooltip 
                        formatter={(value) => [`${value} °C`, '온도']}
                        labelFormatter={(label) => `${label}분`}
                        contentStyle={{ borderRadius: '12px', border: '1px solid #cbd5e1', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)', padding: '8px' }}
                      />
                      <Legend verticalAlign="top" height={30} iconSize={12} wrapperStyle={{ fontSize: '12px' }} />
                      {time >= MAX_TIME && (
                        <ReferenceArea 
                          x1={16} 
                          x2={MAX_TIME} 
                          fill="#fef08a" 
                          fillOpacity={0.4} 
                          label={{ value: "복사 평형 구간", position: "insideTop", fill: "#b45309", fontSize: 14, fontWeight: "bold", offset: 15 }} 
                        />
                      )}
                      <Line 
                        type="monotone" 
                        dataKey="temperature" 
                        name="알루미늄 컵의 온도" 
                        stroke="#ef4444" 
                        strokeWidth={3} 
                        dot={{ r: 0 }}
                        activeDot={{ r: 8, fill: '#ef4444', stroke: 'white', strokeWidth: 2 }}
                        isAnimationActive={false} 
                      />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
                
                {/* 텍스트 선택이 가능하도록 allow-select 클래스 적용 */}
                <div className="allow-select mt-4 md:mt-6 p-4 md:p-5 bg-amber-50 rounded-xl border border-amber-200">
                  <h3 className="font-bold text-amber-800 mb-2 flex items-center gap-2 text-sm md:text-base">
                    <span className="text-lg md:text-xl">🧐</span> 탐구 포인트
                  </h3>
                  <ul className="text-xs md:text-sm text-amber-800 list-disc list-inside space-y-1.5 font-medium leading-relaxed">
                    <li>처음에는 온도가 빠르게 올라가지만, 시간이 지날수록 어떻게 되나요?</li>
                    <li>온도가 더 이상 올라가지 않고 일정하게 유지되는 상태를 무엇이라고 할까요?</li>
                    <li><strong>초기화</strong> 후, 거리를 변경하여 실험해보세요. 평형 온도가 어떻게 달라지나요?</li>
                  </ul>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // React 앱 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
